## Checklist

<!-- Check off items as they are completed -->

### Cryptographic Review
- [ ] X25519/Ed25519 implementation review
- [ ] AES-256-GCM/ChaCha20-Poly1305 review
- [ ] HKDF review
- [ ] No custom cryptography
- [ ] Known-answer test vectors verified

### Key Management Review
- [ ] Identity/device key generation review
- [ ] Key provisioning flow review
- [ ] Key rotation on membership changes
- [ ] Server never holds plaintext keys

### Group-Rotation Review
- [ ] Key distribution on member approval
- [ ] Key rotation on member removal
- [ ] Removed members cannot decrypt new messages
- [ ] Forward secrecy properties

### File Handling Review
- [ ] Client-side encryption before upload
- [ ] R2 storage key namespacing
- [ ] Policy enforcement before URL issuance
- [ ] Server never decrypts file content

### Penetration Test
- [ ] OWASP Top 10
- [ ] Auth/session management
- [ ] Authorization/org-isolation
- [ ] API security
- [ ] Infrastructure security

