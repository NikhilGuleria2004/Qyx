name: Production

on:
  push:
    tags:
      - 'v*'

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Org-isolation regression suite
        run: pnpm test

  build:
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter @qyx/web build

      - name: Build Workers (dry-run)
        run: pnpm --filter @qyx/api-gateway build

  security-gate:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check security review sign-offs
        run: |
          if [ ! -f "security/reviews/pre-production-checklist.md" ]; then
            echo "❌ Security review checklist not found"
            exit 1
          fi
          
          if ! grep -q "All five reviews are complete" security/reviews/pre-production-checklist.md; then
            echo "❌ Security reviews not marked complete"
            exit 1
          fi
          
          if ! grep -q "All critical/high findings remediated" security/reviews/pre-production-checklist.md; then
            echo "❌ Critical/high findings not remediated"
            exit 1
          fi
          
          echo "✅ Security gate passed"

  deploy-production:
    needs: [build, security-gate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run D1 migrations on production
        run: pnpm --filter @qyx/api-gateway db:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}

      - name: Deploy Workers to production
        run: pnpm --filter @qyx/api-gateway deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}

      - name: Deploy frontend to production
        run: pnpm --filter @qyx/web deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}

  post-deploy-smoke:
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production smoke tests
        run: pnpm exec playwright test --config=playwright.config.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
