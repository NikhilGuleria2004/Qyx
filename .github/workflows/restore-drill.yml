name: Restore Drill

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  restore-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: List available backups
        run: npm run restore -- list

      - name: Restore latest D1 backup to staging
        run: |
          BACKUP_DATE=$(npm run restore -- list | tail -n 1 | sed 's/.*r2-manifest-\(.*\)\.json.*/\1/')
          echo "Restoring backup from $BACKUP_DATE"
          npm run restore -- restore $BACKUP_DATE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}

      - name: Verify data integrity
        run: |
          pnpm --filter @qyx/api-gateway wrangler d1 execute qyx_primary_staging --env staging --command "SELECT COUNT(*) as user_count FROM users"
          pnpm --filter @qyx/api-gateway wrangler d1 execute qyx_primary_staging --env staging --command "SELECT COUNT(*) as conversation_count FROM conversations"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}

      - name: Run smoke tests against restored staging
        run: pnpm test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
