name = "qyx"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-12-01"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationDO", "ChannelDO"]

# Default environment bindings (used by wrangler dev / wrangler deploy without --env)
# These mirror the dev environment. Override in [env.staging] / [env.prod] as needed.
[vars]
ALLOWED_ORIGIN = "http://localhost:5173,https://qyx-web-dev.pages.dev"
B2_ENDPOINT = "s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET_NAME = "qyx-bucket"

[[d1_databases]]
binding = "PRIMARY_DB"
database_name = "qyx_primary_prod"
database_id = "5a22b289-859d-4e1f-91ce-6b6b540fc726"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "a20126185ec14d92a0f0dece057687ac"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2942fdd5411646da89dcd9740b7dc78d"

[[kv_namespaces]]
binding = "CHALLENGE_KV"
id = "a65764dd2af4451fad7ffa8c6da003c7"

[[durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDO"

[[durable_objects.bindings]]
name = "CHANNEL_DO"
class_name = "ChannelDO"

[[queues.producers]]
binding = "OFFLINE_DELIVERY_QUEUE"
queue = "offline-delivery-prod"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-prod"

[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "audit-prod"

[env.staging]

[env.staging.vars]
ALLOWED_ORIGIN = "http://localhost:5173,https://qyx-web-staging.pages.dev"
B2_ENDPOINT = "s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET_NAME = "qyx-bucket"

[[env.staging.d1_databases]]
binding = "PRIMARY_DB"
database_name = "qyx_primary_staging"
database_id = "staging"

[[env.staging.kv_namespaces]]
binding = "SESSION_KV"
id = "staging-session-kv"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "staging-rate-limit-kv"

[[env.staging.kv_namespaces]]
binding = "CHALLENGE_KV"
id = "staging-challenge-kv"

[[env.staging.queues.producers]]
binding = "OFFLINE_DELIVERY_QUEUE"
queue = "offline-delivery-staging"

[[env.staging.queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-staging"

[[env.staging.queues.producers]]
binding = "AUDIT_QUEUE"
queue = "audit-staging"

[env.prod]

[env.prod.vars]
ALLOWED_ORIGIN = "https://qyx.pages.dev,http://localhost:5173"
B2_ENDPOINT = "s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET_NAME = "qyx-bucket"

[[env.prod.d1_databases]]
binding = "PRIMARY_DB"
database_name = "qyx_primary_prod"
database_id = "5a22b289-859d-4e1f-91ce-6b6b540fc726"

[[env.prod.kv_namespaces]]
binding = "SESSION_KV"
id = "a20126185ec14d92a0f0dece057687ac"

[[env.prod.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2942fdd5411646da89dcd9740b7dc78d"

[[env.prod.kv_namespaces]]
binding = "CHALLENGE_KV"
id = "a65764dd2af4451fad7ffa8c6da003c7"

[[env.prod.queues.producers]]
binding = "OFFLINE_DELIVERY_QUEUE"
queue = "offline-delivery-prod"

[[env.prod.queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-prod"

[[env.prod.queues.producers]]
binding = "AUDIT_QUEUE"
queue = "audit-prod"

[observability]
enabled = true

[triggers]
crons = ["0 2 * * *", "0 3 * * *"]
