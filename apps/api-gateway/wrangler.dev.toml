name = "api-gateway"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-12-01"

[vars]
ALLOWED_ORIGIN = "http://localhost:5173,https://qyx-web-staging.pages.dev"
B2_ENDPOINT = "s3.us-west-004.backblazeb2.com"
B2_REGION = "us-west-004"
B2_BUCKET_NAME = "qyx-attachments-dev"

[[d1_databases]]
binding = "PRIMARY_DB"
database_name = "qyx_primary_dev"
database_id = "dev"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "dev-session-kv"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "dev-rate-limit-kv"

[[kv_namespaces]]
binding = "CHALLENGE_KV"
id = "dev-challenge-kv"

[[durable_objects]]
binding = "CONVERSATION_DO"
class_name = "ConversationDO"

[[durable_objects]]
binding = "CHANNEL_DO"
class_name = "ChannelDO"

[[queues]]
binding = "OFFLINE_DELIVERY_QUEUE"
queue = "offline-delivery-dev"

[[queues]]
binding = "EMAIL_QUEUE"
queue = "email-dev"

[[queues]]
binding = "AUDIT_QUEUE"
queue = "audit-dev"

[observability]
enabled = true
