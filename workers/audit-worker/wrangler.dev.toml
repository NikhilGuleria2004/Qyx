name = "audit-worker"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-12-01"

[[queues]]
binding = "AUDIT_QUEUE"
queue = "audit-dev"

[[d1_databases]]
binding = "PRIMARY_DB"
database_name = "qyx_primary_dev"
database_id = "dev"

[observability]
enabled = true
