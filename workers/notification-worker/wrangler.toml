name = "notification-worker"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-12-01"

[[queues.producers]]
binding = "OFFLINE_DELIVERY_QUEUE"
queue = "offline-delivery-dev"

[[queues.consumers]]
queue = "offline-delivery-dev"
max_batch_size = 10
max_batch_timeout = 5

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-dev"

[env.staging]
[[env.staging.queues.producers]]
binding = "OFFLINE_DELIVERY_QUEUE"
queue = "offline-delivery-staging"

[[env.staging.queues.consumers]]
queue = "offline-delivery-staging"
max_batch_size = 10
max_batch_timeout = 5

[[env.staging.queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-staging"

[env.prod]
[[env.prod.queues.producers]]
binding = "OFFLINE_DELIVERY_QUEUE"
queue = "offline-delivery-prod"

[[env.prod.queues.consumers]]
queue = "offline-delivery-prod"
max_batch_size = 10
max_batch_timeout = 5

[[env.prod.queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-prod"

[observability]
enabled = true
